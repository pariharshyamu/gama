# The docs site + Havenbrook Courier, served from a single box at
# http://103.39.133.227/.
#
# Everything under here is static: `npm run site:build` produces a directory
# and this hands that directory to browsers. There is no application server,
# no database and no Node process — which is the whole reason a small VPS is
# enough for the lot.
#
# Install (bootstrap.sh does this for you):
#   Debian/Ubuntu  /etc/nginx/sites-available/gama.conf + sites-enabled symlink
#   RHEL-family    /etc/nginx/conf.d/gama.conf
#
# Both of those are included from nginx.conf's `http` block, which is what
# lets the `map` and `types` below sit at the top of this file, outside the
# server — both are http-context directives here, for reasons each explains.

# ------------------------------------------------------------------ types
#
# THIS BLOCK BELONGS AT HTTP LEVEL. Two false starts worth recording, because
# both look right and neither is:
#
#   types { include /etc/nginx/mime.types; model/gltf+json gltf; }
#       mime.types is ITSELF a `types { … }` block, so this nests one inside
#       another and nginx dies with `unexpected "{" in mime.types:2`.
#
#   A bare `types { … }` inside `server { … }`
#       Parses fine, and REPLACES the inherited map rather than extending it
#       — every .css and .js on the site then goes out as
#       application/octet-stream and the page renders as unstyled text with
#       no scripts and no clue why.
#
# Here, in the same context nginx.conf included mime.types into (line ~26,
# well before sites-enabled), a second `types` block accumulates onto the
# first. That is the one arrangement that adds without clobbering.
types {
    # The town/ruins art is glTF, and nginx has never shipped a type for it.
    # Such models do load as octet-stream, but only because three.js sniffs
    # the bytes rather than trusting the header — say what it is.
    model/gltf+json   gltf;
    model/gltf-binary glb;
    # The 27 guides under /docs/. The guide page fetch()es these and renders
    # them client-side, so this is not load-bearing — but without it, opening
    # one directly prompts a download instead of showing text.
    text/markdown     md;
    # The base map has mp3, ogg, m4a and midi, and no wav — which is the one
    # format assets/ui/ actually uses.
    audio/wav         wav;
    # No `application/wasm wasm;` here on purpose: nginx has shipped it since
    # 1.21, and re-declaring an extension logs `duplicate extension` on every
    # config test. Nothing in this build is wasm anyway. If you later put
    # rapier physics on the site and are running something older, add it.
}

# ---------------------------------------------------------------- caching
#
# One map instead of six `location` blocks with their own headers, and that
# is not a style preference. `add_header` in a location REPLACES every
# inherited add_header rather than adding to it, so the obvious version of
# this file — per-location cache rules — silently drops X-Frame-Options and
# Referrer-Policy from exactly the responses that need them most (the HTML).
# Deriving the value instead of branching the directives keeps one header set
# for the whole server.
#
# Regexes are tested in the order written; first match wins.
map $uri $gama_cache {
    # Art, audio, textures. Unhashed, but effectively append-only, and the
    # manifest that indexes them revalidates on every load (below).
    default "public, max-age=86400";

    # Fingerprinted build output: `index-BV5rSx81.js`, `site-DnUZ1ehj.css`.
    # The hash IS the cache key, so a year is safe and a rebuild simply
    # produces a different URL.
    #
    # The pattern is deliberately narrow — 8+ hash chars, code extensions
    # only — because dist/assets/ is a MIXED directory. Vite's hashed bundles
    # land there alongside the game art copied from site/public/assets/
    # (town/, ruins/, ui/, manifest.json). `^/assets/` as a blanket immutable
    # rule would pin stale .gltf files for a year.
    "~*^/(?:play/)?assets/.+-[0-9a-zA-Z_-]{8,}\.(?:js|css|woff2?)$" "public, max-age=31536000, immutable";

    # The vendor bundles sit at FIXED filenames — an import map has nowhere
    # to put a content hash — so site/vite.config.ts stamps the build digest
    # onto the URLs as `?v=…` instead. The query string is the cache key, so
    # a long expiry is safe here and a rebuild busts it.
    "~*^/vendor/" "public, max-age=31536000";

    # Fixed URLs whose CONTENTS change between deploys. The manifest is the
    # nastiest of the three: a stale copy names assets the new build no
    # longer ships, and the loader then fails on a 404 rather than on
    # anything that reads like a cache bug.
    "~*^/assets/manifest\.json$" "no-cache";
    "~*^/docs/"                  "no-cache";

    # HTML last and never immutable: index.html is what points at the hashed
    # bundles, so one cached copy of it pins an entire stale deploy no matter
    # how correct the immutable rule above is.
    "~*\.html$" "no-cache";
}

server {
    # `default_server` matters more than `server_name` here. A browser
    # pointed at a bare IP sends `Host: 103.39.133.227`, which the name below
    # matches — but every bot on the internet arrives with a Host header for
    # somebody else's domain, and without a default server nginx would fall
    # through to whatever block it happened to parse first. This block IS the
    # box.
    listen 80 default_server;
    # IPv6 is commented out because it is not free to guess at: on a kernel
    # without IPv6 this line does not degrade, it kills nginx outright with
    # `socket() [::]:80 failed (97: Address family not supported by
    # protocol)` — a config that passes `nginx -t` for syntax and still
    # refuses to start. bootstrap.sh uncomments it when /proc/net/if_inet6
    # says the box actually has IPv6.
    #listen [::]:80 default_server;
    server_name 103.39.133.227 _;

    # `current` is a symlink into releases/. nginx resolves it per request,
    # so flipping it swaps the live site with no reload and no dropped
    # connection. Do not add `open_file_cache` here without also reloading on
    # deploy — caching the resolved descriptors is precisely what would make
    # that swap stop working.
    root /srv/gama/current;
    index index.html;

    access_log /var/log/nginx/gama.access.log;
    error_log  /var/log/nginx/gama.error.log;

    # Don't advertise the exact nginx version to everything scanning port 80.
    server_tokens off;

    # 4 MB of mostly-precompressible JS. Nothing here is large enough to
    # bother with a body size limit beyond the default, and nothing accepts
    # uploads at all.
    client_max_body_size 1m;

    # (MIME types are at the top of this file, at http level — see the note
    # there before you move them in here.)

    # ---------------------------------------------------------------- gzip
    #
    # The bundles are the payload: megabytes of three.js and library JS that
    # compress to roughly a quarter of that. `gzip_static` is not used
    # because the build does not pre-compress; this is on-the-fly.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/markdown text/javascript
        application/javascript application/json application/wasm
        model/gltf+json image/svg+xml;

    # ------------------------------------------------------------- headers
    #
    # One set, server-wide, for the add_header reason explained at the map.
    #
    # No Content-Security-Policy, deliberately. The playground runs
    # user-authored code by compiling it to a `blob:` module URL and
    # importing it into a same-origin iframe (site/src/runner.ts), so a
    # reflexive `default-src 'self'` breaks the single most interesting page
    # on the site. A working CSP here has to allow at least `script-src
    # 'self' blob:` and `worker-src blob:` — and should be checked against
    # `node site/verify-playgrounds.mjs` before you believe it.
    add_header Cache-Control          $gama_cache                   always;
    add_header X-Content-Type-Options nosniff                       always;
    add_header Referrer-Policy        strict-origin-when-cross-origin always;
    # SAMEORIGIN rather than DENY: the landing page frames its own hero demo
    # and the playground frames its own preview.
    add_header X-Frame-Options        SAMEORIGIN                    always;

    # --------------------------------------------------------------- routing
    #
    # A liveness probe that does not depend on a deploy having happened —
    # bootstrap.sh curls this to prove nginx came up, before there is a site.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The site is five separate HTML entry points (index, guide, playground,
    # runner, editor) plus the game's own two under /play/. It is NOT a SPA,
    # so there is deliberately no `try_files … /index.html` fallback: a
    # mistyped URL must 404 rather than silently render the landing page and
    # look like the link worked. The `$uri.html` step is the one nicety — it
    # makes /guide work as well as /guide.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Nothing in a static build should be serving dotfiles.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ----------------------------------------------------------------- tls
    #
    # There is none, and on a bare IP that is not an oversight: Let's Encrypt
    # does not issue certificates for IP addresses, so http:// is the honest
    # ceiling here. The moment a domain points at this box:
    #
    #     # add `server_name example.com;` above first, or certbot has
    #     # nothing to match
    #     sudo certbot --nginx -d example.com
    #
    # which rewrites this block in place, adds the 443 listener and the
    # HTTP->HTTPS redirect, and installs a renewal timer.
}
