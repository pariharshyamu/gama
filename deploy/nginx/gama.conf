# The docs site + Havenbrook Courier over plain HTTP.
#
# This is the BEFORE-TLS config: what bootstrap.sh installs on a fresh box,
# and what serves the site until a certificate exists. `enable-tls.sh`
# replaces it with gama-tls.conf. Exactly one of the two is ever enabled —
# both include snippets/gama-http.conf, and two copies of that `map` is a
# hard config error, which is the failure you want if both get enabled.
#
# Everything served here is static: `npm run site:build` produces a directory
# and this hands that directory to browsers. There is no application server,
# no database and no Node process — which is the whole reason a small VPS is
# enough for the lot.
#
# Install (bootstrap.sh does this for you):
#   Debian/Ubuntu  /etc/nginx/sites-available/gama.conf + sites-enabled symlink
#   RHEL-family    /etc/nginx/conf.d/gama.conf

include /etc/nginx/snippets/gama-http.conf;

server {
    # `default_server` matters more than `server_name` here. A browser
    # pointed at the bare IP sends `Host: 103.39.133.227`, which the names
    # below match — but every bot on the internet arrives with a Host header
    # for somebody else's domain, and without a default server nginx would
    # fall through to whatever block it happened to parse first. This block
    # IS the box.
    listen 80 default_server;
    # IPv6 is commented out because it is not free to guess at: on a kernel
    # without IPv6 this line does not degrade, it kills nginx outright with
    # `socket() [::]:80 failed (97: Address family not supported by
    # protocol)` — a config that passes `nginx -t` for syntax and still
    # refuses to start. bootstrap.sh uncomments it when /proc/net/if_inet6
    # says the box actually has IPv6.
    #listen [::]:80 default_server;
    server_name gama.playmeet.games 103.39.133.227 _;

    # ACME http-01, so `enable-tls.sh` can prove control of the domain
    # without stopping nginx.
    #
    # `^~`, NOT a plain prefix. snippets/gama-site.conf denies everything
    # matching the regex `/\.`, and `.well-known` starts with a dot — a
    # regex location outranks a prefix one, so the obvious spelling of this
    # gets a 403 and certbot fails with an unauthorized error that says
    # nothing about nginx. `^~` is the one prefix form that outranks regex.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/snippets/gama-site.conf;
}

# ----------------------------------------------------------------- tls
#
# None here, on purpose. Once gama.playmeet.games resolves to this box:
#
#     sudo bash /tmp/gama-deploy/enable-tls.sh
#
# which obtains a certificate over the ACME location above and swaps this
# file for gama-tls.conf. Note it uses `certbot certonly`, NOT `certbot
# --nginx`: the --nginx plugin rewrites the server block IN PLACE, and this
# config is version-controlled and re-installed by bootstrap.sh, so the very
# next provisioning run would silently revert TLS. The certificate is data
# and lives on the box; the config is code and lives in git.
