# The docs site + Havenbrook Courier over HTTPS, on gama.playmeet.games.
#
# This is the AFTER-TLS config. `enable-tls.sh` installs it in place of
# gama.conf once a certificate exists — never both at once, since both
# include snippets/gama-http.conf and two copies of that `map` is a hard
# config error.
#
# It will not load before the certificate does: nginx refuses to start with
# `cannot load certificate … No such file or directory` if the paths below
# are absent. That is why this is a separate file rather than a commented
# block in gama.conf — a config that cannot start is worse than one that
# serves plain HTTP.

include /etc/nginx/snippets/gama-http.conf;

# ------------------------------------------------------------------ :80
#
# Two jobs and no site: answer ACME, and send everyone to HTTPS.
server {
    listen 80 default_server;
    #listen [::]:80 default_server;
    server_name gama.playmeet.games 103.39.133.227 _;

    # Renewals land here, not on :443 — an http-01 challenge always starts on
    # port 80. Let's Encrypt does follow redirects, so the 301 below would
    # technically work too, but serving the challenge directly means renewal
    # does not depend on the redirect being correct.
    #
    # `^~` for the reason spelled out in gama.conf: the dotfile-deny regex in
    # snippets/gama-site.conf would otherwise 403 `.well-known`.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 301 and not 302: this is permanent, and a cached permanent redirect is
    # the point — it is what stops the second visit ever going out in clear.
    #
    # $host rather than the literal domain, so a request to the bare IP over
    # HTTP redirects to the IP over HTTPS (where it will hit a certificate
    # name mismatch and say so) instead of silently landing somewhere the
    # visitor did not type.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------- :443, the wrong name
#
# THIS is the default server for 443, and the order matters more than it
# looks. https://103.39.133.227/ — and every bot arriving with a Host header
# for someone else's domain — lands here rather than on the site.
#
# Putting `default_server` on the site block instead is the easy mistake: it
# parses, it serves, and it quietly makes the site answer to any name at all,
# including the IP that the certificate explicitly does not cover.
#
# All the socket-level listen options live here, on the one block that owns
# the default: nginx takes `ssl`, `http2` and `default_server` per listening
# socket, so declaring them once in a single place avoids arguing with it
# about duplicates.
#
# `http2` on the listen line rather than the standalone `http2 on;`
# directive: the latter arrived in nginx 1.25.1, and Ubuntu 24.04 — the
# likely box here — ships 1.24. This spelling works on both; on 1.25.1+ it
# logs a deprecation notice and still enables HTTP/2. HTTP/2 is worth having:
# the site pulls dozens of small hashed assets per page.
server {
    listen 443 ssl http2 default_server;
    #listen [::]:443 ssl http2 default_server;
    server_name _;

    # Same certificate — there is no other one to offer, and nginx requires
    # one to complete a handshake it is about to reject at the HTTP layer. A
    # browser reaching here by IP has already been warned about the name
    # mismatch; this is what it gets if the visitor clicks through.
    ssl_certificate         /etc/letsencrypt/live/gama.playmeet.games/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/gama.playmeet.games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 421 Misdirected Request: "you reached the right machine under the wrong
    # name". Precisely true here, and more use to whoever is reading it than
    # a 404 would be.
    return 421;
}

# ------------------------------------------------------- :443, the site
server {
    # No listen options here beyond `ssl` — they belong to the socket, and
    # the default server above already set them.
    listen 443 ssl;
    #listen [::]:443 ssl;
    server_name gama.playmeet.games;

    ssl_certificate         /etc/letsencrypt/live/gama.playmeet.games/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/gama.playmeet.games/privkey.pem;
    # For OCSP stapling to verify — without it `ssl_stapling_verify on` is
    # inert rather than wrong, but inert.
    ssl_trusted_certificate /etc/letsencrypt/live/gama.playmeet.games/chain.pem;

    # Mozilla "intermediate", written out rather than pulled from certbot's
    # /etc/letsencrypt/options-ssl-nginx.conf. That file is an implementation
    # detail of the certbot package: it is absent if certbot came from pip or
    # snap, and `include`ing a missing file stops nginx dead. This config
    # depends on the CERTIFICATE existing, and on nothing else certbot ships.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:GamaSSL:10m;
    ssl_session_timeout 1d;
    # Off because session tickets without key rotation undermine forward
    # secrecy, and nginx has no key rotation.
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    include /etc/nginx/snippets/gama-site.conf;

    # HSTS goes HERE and not in the shared snippet, because the snippet is
    # also used by the plain-HTTP config, and an HSTS header sent over http://
    # is ignored by browsers — a header that does nothing is a header someone
    # will later trust.
    #
    # This accumulates onto the four add_headers in the snippet rather than
    # replacing them: `include` splices directives into THIS server context,
    # so they all sit at the same level. (A location with its own add_header
    # would still drop all five — there are none, deliberately.)
    #
    # One year, no `includeSubDomains`, no `preload`. All three are choices:
    #   - includeSubDomains would commit every *.gama.playmeet.games too,
    #     including any that does not speak HTTPS yet.
    #   - preload is effectively irreversible — it bakes the name into
    #     browser binaries, and removal takes months.
    # To back out, serve `max-age=0` for longer than the longest max-age any
    # visitor has already cached. Turning HSTS off is not the same as
    # removing the header.
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# --------------------------------------------------------- the bare IP
#
# Worth stating plainly, because it will look like a regression the first
# time someone tries it: http://103.39.133.227/ now redirects to
# https://103.39.133.227/, and a certificate for gama.playmeet.games does
# not match an IP, so the browser warns and then the 421 block answers.
#
# That is correct, not a bug to paper over — the certificate says what it
# says, and Let's Encrypt will not issue one for an IP. The site is at
# https://gama.playmeet.games/. Use the name.
