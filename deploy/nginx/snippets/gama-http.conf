# http-context directives shared by the HTTP-only and the TLS config.
# Installed to /etc/nginx/snippets/gama-http.conf and included ONCE, from
# whichever of gama.conf / gama-tls.conf is enabled. Including both at the
# same time is a duplicate-`map` error, which is exactly the failure you want
# if two site configs are ever enabled at once.

# ------------------------------------------------------------------ types
#
# THIS BLOCK BELONGS AT HTTP LEVEL. Two false starts worth recording, because
# both look right and neither is:
#
#   types { include /etc/nginx/mime.types; model/gltf+json gltf; }
#       mime.types is ITSELF a `types { … }` block, so this nests one inside
#       another and nginx dies with `unexpected "{" in mime.types:2`.
#
#   A bare `types { … }` inside `server { … }`
#       Parses fine, and REPLACES the inherited map rather than extending it
#       — every .css and .js on the site then goes out as
#       application/octet-stream and the page renders as unstyled text with
#       no scripts and no clue why.
#
# Here, in the same context nginx.conf included mime.types into (line ~26,
# well before sites-enabled), a second `types` block accumulates onto the
# first. That is the one arrangement that adds without clobbering.
types {
    # The town/ruins art is glTF, and nginx has never shipped a type for it.
    # Such models do load as octet-stream, but only because three.js sniffs
    # the bytes rather than trusting the header — say what it is.
    model/gltf+json   gltf;
    model/gltf-binary glb;
    # The 27 guides under /docs/. The guide page fetch()es these and renders
    # them client-side, so this is not load-bearing — but without it, opening
    # one directly prompts a download instead of showing text.
    text/markdown     md;
    # The base map has mp3, ogg, m4a and midi, and no wav — which is the one
    # format assets/ui/ actually uses.
    audio/wav         wav;
    # No `application/wasm wasm;` here on purpose: nginx has shipped it since
    # 1.21, and re-declaring an extension logs `duplicate extension` on every
    # config test. Nothing in this build is wasm anyway. If you later put
    # rapier physics on the site and are running something older, add it.
}

# ---------------------------------------------------------------- caching
#
# One map instead of six `location` blocks with their own headers, and that
# is not a style preference. `add_header` in a location REPLACES every
# inherited add_header rather than adding to it, so the obvious version of
# this file — per-location cache rules — silently drops X-Frame-Options and
# Referrer-Policy from exactly the responses that need them most (the HTML).
# Deriving the value instead of branching the directives keeps one header set
# for the whole server.
#
# Regexes are tested in the order written; first match wins.
map $uri $gama_cache {
    # Art, audio, textures. Unhashed, but effectively append-only, and the
    # manifest that indexes them revalidates on every load (below).
    default "public, max-age=86400";

    # Fingerprinted build output: `index-BV5rSx81.js`, `site-DnUZ1ehj.css`.
    # The hash IS the cache key, so a year is safe and a rebuild simply
    # produces a different URL.
    #
    # The pattern is deliberately narrow — 8+ hash chars, code extensions
    # only — because dist/assets/ is a MIXED directory. Vite's hashed bundles
    # land there alongside the game art copied from site/public/assets/
    # (town/, ruins/, ui/, manifest.json). `^/assets/` as a blanket immutable
    # rule would pin stale .gltf files for a year.
    "~*^/(?:play/)?assets/.+-[0-9a-zA-Z_-]{8,}\.(?:js|css|woff2?)$" "public, max-age=31536000, immutable";

    # The vendor bundles sit at FIXED filenames — an import map has nowhere
    # to put a content hash — so site/vite.config.ts stamps the build digest
    # onto the URLs as `?v=…` instead. The query string is the cache key, so
    # a long expiry is safe here and a rebuild busts it.
    "~*^/vendor/" "public, max-age=31536000";

    # Fixed URLs whose CONTENTS change between deploys. The manifest is the
    # nastiest of the three: a stale copy names assets the new build no
    # longer ships, and the loader then fails on a 404 rather than on
    # anything that reads like a cache bug.
    "~*^/assets/manifest\.json$" "no-cache";
    "~*^/docs/"                  "no-cache";

    # HTML last and never immutable: index.html is what points at the hashed
    # bundles, so one cached copy of it pins an entire stale deploy no matter
    # how correct the immutable rule above is.
    "~*\.html$" "no-cache";
}
