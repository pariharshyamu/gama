# The site itself: everything that serves /srv/gama/current.
#
# Installed to /etc/nginx/snippets/gama-site.conf and included INSIDE a
# `server { … }` block — by the :80 server in gama.conf, or by the :443
# server in gama-tls.conf. Which listener is in front of it is the only
# difference between plain HTTP and HTTPS, so this file is the reason
# enabling TLS does not fork the part that matters.

# `current` is a symlink into releases/. nginx resolves it per request, so
# flipping it swaps the live site with no reload and no dropped connection.
# Do not add `open_file_cache` here without also reloading on deploy —
# caching the resolved descriptors is precisely what would make that swap
# stop working.
root /srv/gama/current;
index index.html;

access_log /var/log/nginx/gama.access.log;
error_log  /var/log/nginx/gama.error.log;

# Don't advertise the exact nginx version to everything scanning the port.
server_tokens off;

# 4 MB of mostly-precompressible JS. Nothing here is large enough to bother
# with a body size limit beyond the default, and nothing accepts uploads.
client_max_body_size 1m;

# (MIME types are in snippets/gama-http.conf, at http level — see the note
# there before you move them in here.)

# ---------------------------------------------------------------- gzip
#
# The bundles are the payload: megabytes of three.js and library JS that
# compress to roughly a quarter of that. `gzip_static` is not used because
# the build does not pre-compress; this is on-the-fly.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain text/css text/markdown text/javascript
    application/javascript application/json application/wasm
    model/gltf+json image/svg+xml;

# ------------------------------------------------------------- headers
#
# One set, server-wide, for the add_header reason explained in
# snippets/gama-http.conf. The TLS config adds Strict-Transport-Security
# alongside these — it can, because an `include` splices these directives
# into the same server context rather than a nested one, so they accumulate
# instead of replacing.
#
# No Content-Security-Policy, deliberately. The playground runs user-authored
# code by compiling it to a `blob:` module URL and importing it into a
# same-origin iframe (site/src/runner.ts), so a reflexive `default-src 'self'`
# breaks the single most interesting page on the site. A working CSP here has
# to allow at least `script-src 'self' blob:` and `worker-src blob:` — and
# should be checked against `node site/verify-playgrounds.mjs` before you
# believe it.
add_header Cache-Control          $gama_cache                     always;
add_header X-Content-Type-Options nosniff                         always;
add_header Referrer-Policy        strict-origin-when-cross-origin always;
# SAMEORIGIN rather than DENY: the landing page frames its own hero demo and
# the playground frames its own preview.
add_header X-Frame-Options        SAMEORIGIN                      always;

# --------------------------------------------------------------- routing
#
# A liveness probe that does not depend on a deploy having happened —
# bootstrap.sh curls this to prove nginx came up, before there is a site.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The site is five separate HTML entry points (index, guide, playground,
# runner, editor) plus the game's own two under /play/. It is NOT a SPA, so
# there is deliberately no `try_files … /index.html` fallback: a mistyped URL
# must 404 rather than silently render the landing page and look like the
# link worked. The `$uri.html` step is the one nicety — it makes /guide work
# as well as /guide.html.
location / {
    try_files $uri $uri.html $uri/ =404;
}

# Nothing in a static build should be serving dotfiles.
#
# Note for anyone adding ACME here: this regex would swallow
# /.well-known/acme-challenge/ and 403 it, because a regex location beats a
# plain prefix one. The challenge locations in gama.conf and gama-tls.conf
# use `^~` for exactly that reason — `^~` outranks regex.
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
